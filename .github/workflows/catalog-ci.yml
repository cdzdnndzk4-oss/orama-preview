name: Catalog and photo checks
on:
  push:
    branches: [production/admin-catalog-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r service/requirements.txt pytest httpx
      - run: python -m pytest -q tests
      - run: node tests/storefront.cjs
